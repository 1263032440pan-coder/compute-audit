listen: "0.0.0.0:18080"
tls:
  cert_file: /etc/compute-audit/tls/server.crt
  key_file: /etc/compute-audit/tls/server.key
  client_ca_file: /etc/compute-audit/tls/agent-ca.crt
  require_client_cert: true
database:
  host: audit-db:3306
  name: compute_audit
  user: audit_app
  password_env: AUDIT_DB_PASSWORD
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 5m
deepflow:
  enabled: false
  endpoint: http://deepflow-server:20416
  database: flow_log
  table: l7_flow_log
  instance_id: deepflow-primary
  profile_file: /etc/compute-audit/deepflow-profile.yaml
  # Optional: set token_env and provide the token through the process environment.
  # token_env: DEEPFLOW_TOKEN
  # ca_file: /etc/compute-audit/tls/deepflow-ca.crt
  timeout: 30s
  page_size: 1000
  max_pages_per_window: 100
  snapshot_max_age: 30s
